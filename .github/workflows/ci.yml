name: VKAI CI · Build & Test

# Runs the client-automatable regression suite (@Client and not @Manual) against the
# live client portal. Triggers on PRs into dev/main and on manual dispatch — NOT on
# every push to dev, to bound the real test-data written to the live dev database.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# One run per ref; a newer run cancels an older in-flight one (also limits concurrent
# writes to the live portal).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (headless Chrome)
    runs-on: ubuntu-latest
    env:
      # Base URL is public (also in the README) — kept as plain env so it stays readable
      # in logs. Only the QA credentials are secrets. ConfigReader reads all of these
      # env-first, so nothing else is needed.
      VKAI_CLIENT_BASE_URL: https://vkai-insurance-client.vercel.app
      VKAI_CLIENT_EMAIL: ${{ secrets.VKAI_CLIENT_EMAIL }}
      VKAI_CLIENT_PASSWORD: ${{ secrets.VKAI_CLIENT_PASSWORD }}
      VKAI_AUTOMATION_HEADLESS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Chrome version (Selenium Manager fetches the matching driver)
        run: google-chrome --version

      - name: Run regression suite
        run: mvn -B -ntp test

      - name: Upload reports (ExtentReport + Cucumber)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            target/cucumber-reports/
          if-no-files-found: warn
          retention-days: 14
