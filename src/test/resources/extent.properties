# ExtentReports Cucumber adapter (tech.grasshopper) configuration.
# Spark HTML report is written under reports/ (gitignored, published as a CI artifact).
extent.reporter.spark.start=true
extent.reporter.spark.out=reports/spark/index.html

# Failure screenshots are attached to scenarios in Hooks and embedded (base64) inline.
screenshot.dir=reports/screenshots/
screenshot.rel.path=../screenshots/
